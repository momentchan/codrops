<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still — Codrops preview</title>
    <link rel="preconnect" href="https://tympanus.net" />
    <link rel="preconnect" href="https://codrops-1f606.kxcdn.com" />
    <link
      rel="stylesheet"
      href="https://codrops-1f606.kxcdn.com/codrops/wp-content/themes/codropstheme03/css/main.css?x57826"
    />
    <link
      rel="stylesheet"
      href="https://codrops-1f606.kxcdn.com/codrops/wp-content/plugins/prismatic/lib/prism/css/theme-okaidia.css?x57826&ver=3.7.5"
    />
    <style>
      @font-face {
        font-family: InterVariable;
        font-weight: 100 900;
        font-display: block;
        font-style: normal;
        src: url("https://tympanus.net/codrops/wp-content/themes/codropstheme03/fonts/Inter/InterVariable.woff2") format("woff2");
      }
      @font-face {
        font-family: InterVariable;
        font-weight: 100 900;
        font-display: block;
        font-style: italic;
        src: url("https://tympanus.net/codrops/wp-content/themes/codropstheme03/fonts/Inter/InterVariable-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: AlphaLyrae;
        src: url("https://tympanus.net/codrops/wp-content/themes/codropstheme03/fonts/Alpha/AlphaLyrae-Medium.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
    </style>
  </head>
  <body
    id="codrops-body"
    class="wp-singular post-template-default single single-post single-format-standard wp-theme-codropstheme03"
  >
    <div class="ct-container">
      <p class="preview-badge">Local preview · save wordpress.md to refresh</p>
      <div class="ct-content">
        <div class="ct-inner">
          <div class="ct-main ct-main-post" id="ct-main" role="main">
            <div class="ct-post">
              <article id="post" class="post type-post status-publish format-standard hentry category-articles"></article>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
