<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="280" viewBox="0 0 1180 280" role="img" aria-label="Hearts and hops flowchart">
  <rect width="1180" height="280" fill="#f6f1e8"/>

  <rect x="36" y="70" width="176" height="112" rx="4" fill="#f6f1e8" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="124" y="58" text-anchor="middle" fill="#b8860b" font-family="Georgia, Times New Roman, serif" font-size="11" font-weight="600">1</text>
  <text x="124" y="108" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700">Split by pin</text>
  <text x="124" y="132" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">Count follows</text>
  <text x="124" y="150" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">each pin weight</text>

  <line x1="212" y1="126" x2="248" y2="126" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="256,126 246,121 246,131" fill="#1a1a1a"/>

  <rect x="256" y="70" width="176" height="112" rx="4" fill="#f6f1e8" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="344" y="58" text-anchor="middle" fill="#b8860b" font-family="Georgia, Times New Roman, serif" font-size="11" font-weight="600">2</text>
  <text x="344" y="108" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700">Place hearts</text>
  <text x="344" y="132" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">Sample the density</text>
  <text x="344" y="150" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">field until it sticks</text>

  <line x1="432" y1="126" x2="468" y2="126" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="476,126 466,121 466,131" fill="#1a1a1a"/>

  <rect x="476" y="70" width="176" height="112" rx="4" fill="#f6f1e8" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="564" y="58" text-anchor="middle" fill="#b8860b" font-family="Georgia, Times New Roman, serif" font-size="11" font-weight="600">3</text>
  <text x="564" y="108" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700">Hop off a heart</text>
  <text x="564" y="132" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">Short random step;</text>
  <text x="564" y="150" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">keep if the field accepts</text>

  <line x1="652" y1="126" x2="688" y2="126" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="696,126 686,121 686,131" fill="#1a1a1a"/>

  <rect x="696" y="70" width="176" height="112" rx="4" fill="#f6f1e8" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="784" y="58" text-anchor="middle" fill="#b8860b" font-family="Georgia, Times New Roman, serif" font-size="11" font-weight="600">4</text>
  <text x="784" y="108" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700">Size from density</text>
  <text x="784" y="132" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">Head size and how</text>
  <text x="784" y="150" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">far it can open</text>

  <line x1="872" y1="126" x2="908" y2="126" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="916,126 906,121 906,131" fill="#1a1a1a"/>

  <rect x="916" y="70" width="176" height="112" rx="4" fill="#f6f1e8" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="1004" y="58" text-anchor="middle" fill="#b8860b" font-family="Georgia, Times New Roman, serif" font-size="11" font-weight="600">5</text>
  <text x="1004" y="108" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700">Rose and dahlia</text>
  <text x="1004" y="132" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">Rose fills the mass;</text>
  <text x="1004" y="150" text-anchor="middle" fill="#3a3a3a" font-family="Georgia, Times New Roman, serif" font-size="12">dahlia stays rare</text>
</svg>
